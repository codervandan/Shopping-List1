<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Shopping List</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --ink: #1a1a18;
    --muted: #8a8780;
    --accent: #c8440a;
    --accent-light: #fdeee7;
    --line: #e8e4dc;
    --green: #2d6a4f;
    --shadow: 0 2px 16px rgba(0,0,0,0.07);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 40px 20px 80px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23000000' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    max-width: 640px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 36px;
    animation: fadeDown 0.6s ease both;
  }

  .header-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-light);
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 6vw, 3rem);
    color: var(--ink);
    line-height: 1.1;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    margin-top: 8px;
    font-size: 14px;
    color: var(--muted);
    font-weight: 300;
  }

  /* Save indicator */
  .save-indicator {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 10px;
    font-size: 11px;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .save-indicator.show { opacity: 1; }

  .save-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
  }

  /* Add form */
  .add-card {
    background: var(--card);
    border-radius: 18px;
    padding: 24px;
    box-shadow: var(--shadow);
    margin-bottom: 28px;
    border: 1px solid var(--line);
    animation: fadeUp 0.6s 0.1s ease both;
  }

  .add-card label {
    display: block;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 12px;
  }

  .input-row   { display: flex; gap: 10px; }
  .input-item  { flex: 1; }
  .input-price { width: 110px; flex-shrink: 0; }

  input[type="text"],
  input[type="number"] {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--ink);
    background: var(--bg);
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(200, 68, 10, 0.1);
    background: #fff;
  }

  input::placeholder { color: #ccc; }

  .price-wrap       { position: relative; }
  .price-wrap span  { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }
  .price-wrap input { padding-left: 28px; }

  .btn-add {
    margin-top: 14px;
    width: 100%;
    padding: 13px;
    background: var(--ink);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.5px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-add:hover  { background: var(--accent); }
  .btn-add:active { transform: scale(0.98); }
  .btn-add svg    { width: 16px; height: 16px; }

  /* List header */
  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding: 0 4px;
    animation: fadeUp 0.6s 0.2s ease both;
  }

  .list-title  { font-family: 'Playfair Display', serif; font-size: 18px; }

  .count-badge {
    background: var(--accent-light);
    color: var(--accent);
    font-size: 12px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
  }

  .col-labels {
    display: flex;
    justify-content: space-between;
    padding: 0 18px;
    margin-bottom: 8px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--muted);
    animation: fadeUp 0.6s 0.25s ease both;
  }

  /* Items */
  #list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: fadeUp 0.6s 0.3s ease both;
  }

  .item {
    background: var(--card);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.2s;
    animation: slideIn 0.3s ease both;
  }

  .item:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }

  /* Editing state — highlight the row */
  .item.editing {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(200, 68, 10, 0.08);
    transform: translateY(-1px);
  }

  .item.removing { animation: slideOut 0.3s ease forwards; overflow: hidden; }

  .item.checked .item-name  { text-decoration: line-through; color: var(--muted); }
  .item.checked .item-price { color: var(--muted); }

  .check-btn {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    font-size: 11px;
    transition: all 0.2s;
  }

  .item.checked .check-btn { background: var(--green); border-color: var(--green); color: white; }

  .item-name  { flex: 1; font-size: 15px; font-weight: 400; transition: color 0.2s; word-break: break-word; }
  .item-price { font-size: 15px; font-weight: 500; color: var(--accent); white-space: nowrap; min-width: 60px; text-align: right; transition: color 0.2s; }

  /* Inline price editor — hidden by default, shown when editing */
  .price-edit-wrap {
    display: none;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .item.editing .item-price    { display: none; }
  .item.editing .price-edit-wrap { display: flex; }

  .price-edit-wrap .currency { font-size: 13px; color: var(--muted); }

  .price-edit-input {
    width: 72px;
    padding: 5px 8px;
    border: 1.5px solid var(--accent);
    border-radius: 7px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    background: #fff;
    outline: none;
    box-shadow: 0 0 0 3px rgba(200, 68, 10, 0.08);
    /* Override the global input style for this specific input */
    padding-left: 8px !important;
  }

  .save-edit-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: var(--green);
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }

  .save-edit-btn:hover  { background: #235c41; }
  .save-edit-btn:active { transform: scale(0.95); }

  /* Shared icon button styles — edit & delete */
  .delete-btn,
  .edit-btn {
    width: 30px;
    height: 30px;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, color 0.15s;
  }

  .edit-btn   { color: #bbb; }
  .delete-btn { color: #ccc; }

  .edit-btn:hover   { background: #e8f0fe; color: #3b6fd4; }
  .delete-btn:hover { background: #fee2e2; color: #e53e3e; }

  /* Hide edit button while already editing that row */
  .item.editing .edit-btn { display: none; }

  /* Empty state */
  .empty      { text-align: center; padding: 48px 20px; color: var(--muted); display: none; }
  .empty.show { display: block; }
  .empty-icon { font-size: 48px; margin-bottom: 12px; display: block; }
  .empty p    { font-size: 14px; font-weight: 300; }

  /* Total */
  .total-card {
    margin-top: 20px;
    background: var(--ink);
    color: #fff;
    border-radius: 14px;
    padding: 18px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    animation: fadeUp 0.6s 0.35s ease both;
  }

  .total-label { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.6; }
  .total-sub   { font-size: 11px; opacity: 0.5; margin-top: 2px; }

  .total-amount {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: #fff;
  }

  .total-amount.bump { animation: bump 0.3s ease; }

  .actions { display: flex; justify-content: flex-end; margin-top: 14px; animation: fadeUp 0.6s 0.4s ease both; }

  .btn-clear {
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 7px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-clear:hover { border-color: #e53e3e; color: #e53e3e; background: #fee2e2; }

  @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp   { from { opacity: 0; transform: translateY(16px);  } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn  { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes slideOut {
    from { opacity: 1; transform: translateX(0);   max-height: 80px; margin-bottom: 8px; }
    to   { opacity: 0; transform: translateX(20px); max-height: 0;   padding: 0; margin: 0; }
  }
  @keyframes bump {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>

<div class="wrapper">
  <header>
    <div class="header-tag">🛒 Shopping List</div>
    <h1>Shopping <span>List</span></h1>
    <p class="subtitle">Add your items and keep track of the cost</p>
    <div class="save-indicator" id="saveIndicator">
      <span class="save-dot"></span> Saved
    </div>
  </header>

  <div class="add-card">
    <label>Add a new item</label>
    <div class="input-row">
      <div class="input-item">
        <input type="text" id="itemName" placeholder="e.g. Organic oat milk" />
      </div>
      <div class="input-price">
        <div class="price-wrap">
          <span>$</span>
          <input type="number" id="itemPrice" placeholder="0.00" min="0" step="0.01" />
        </div>
      </div>
    </div>
    <button class="btn-add" onclick="addItem()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Add to List
    </button>
  </div>

  <div class="list-header">
    <span class="list-title">Your List</span>
    <span class="count-badge" id="countBadge">0 items</span>
  </div>

  <div class="col-labels">
    <span>Item</span>
    <span style="margin-right:38px">Price</span>
  </div>

  <div id="list"></div>

  <div class="empty" id="empty">
    <span class="empty-icon">🥬</span>
    <p>Your list is empty — add something above!</p>
  </div>

  <div class="total-card">
    <div>
      <div class="total-label">Estimated Total</div>
      <div class="total-sub" id="totalSub">0 items in your list</div>
    </div>
    <div class="total-amount" id="totalAmount">$0.00</div>
  </div>

  <div class="actions">
    <button class="btn-clear" onclick="clearAll()">Clear all items</button>
  </div>
</div>

<script>
  const STORAGE_KEY = 'market-run-items';

  // ── Persistence ──────────────────────────────────────────────

  function loadFromStorage() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : [];
    } catch (e) {
      return [];
    }
  }

  let saveTimer = null;

  function saveToStorage() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      flashSaved();
    } catch (e) {
      // Storage unavailable — fail silently
    }
  }

  function flashSaved() {
    const indicator = document.getElementById('saveIndicator');
    indicator.classList.add('show');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => indicator.classList.remove('show'), 2000);
  }

  // ── State ────────────────────────────────────────────────────

  let items = loadFromStorage();

  // ── Inputs ───────────────────────────────────────────────────

  const nameInput  = document.getElementById('itemName');
  const priceInput = document.getElementById('itemPrice');

  [nameInput, priceInput].forEach(el => {
    el.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
  });

  // ── Actions ──────────────────────────────────────────────────

  function addItem() {
    const name  = nameInput.value.trim();
    const price = parseFloat(priceInput.value);

    if (!name) {
      nameInput.focus();
      nameInput.style.borderColor = '#e53e3e';
      setTimeout(() => nameInput.style.borderColor = '', 1200);
      return;
    }

    items.push({ id: Date.now(), name, price: isNaN(price) ? 0 : price, checked: false });
    nameInput.value  = '';
    priceInput.value = '';
    nameInput.focus();
    saveToStorage();
    render();
  }

  function deleteItem(id) {
    const el = document.querySelector(`[data-id="${id}"]`);
    if (el) {
      el.classList.add('removing');
      el.addEventListener('animationend', () => {
        items = items.filter(i => i.id !== id);
        saveToStorage();
        render();
      }, { once: true });
    }
  }

  function toggleCheck(id) {
    const item = items.find(i => i.id === id);
    if (item) item.checked = !item.checked;
    saveToStorage();
    render();
  }

  // ── Edit price ───────────────────────────────────────────────

  function startEdit(id) {
    // Close any other open edit first
    document.querySelectorAll('.item.editing').forEach(el => {
      if (Number(el.dataset.id) !== id) cancelEdit(Number(el.dataset.id));
    });

    const el = document.querySelector(`[data-id="${id}"]`);
    if (!el) return;

    const item  = items.find(i => i.id === id);
    const input = el.querySelector('.price-edit-input');

    el.classList.add('editing');
    input.value = item.price > 0 ? item.price.toFixed(2) : '';
    input.focus();
    input.select();
  }

  function confirmEdit(id) {
    const el    = document.querySelector(`[data-id="${id}"]`);
    if (!el) return;

    const input = el.querySelector('.price-edit-input');
    const item  = items.find(i => i.id === id);
    const newPrice = parseFloat(input.value);

    if (item) {
      item.price = isNaN(newPrice) || newPrice < 0 ? 0 : newPrice;
    }

    el.classList.remove('editing');
    saveToStorage();
    render();
  }

  function cancelEdit(id) {
    const el = document.querySelector(`[data-id="${id}"]`);
    if (el) el.classList.remove('editing');
  }

  // ── Clear ────────────────────────────────────────────────────

  function clearAll() {
    if (!items.length) return;
    if (confirm('Clear all items from your list?')) {
      items = [];
      saveToStorage();
      render();
    }
  }

  // ── Render ───────────────────────────────────────────────────

  function render() {
    const list    = document.getElementById('list');
    const empty   = document.getElementById('empty');
    const badge   = document.getElementById('countBadge');
    const totalEl = document.getElementById('totalAmount');
    const sub     = document.getElementById('totalSub');

    list.innerHTML = items.map(item => `
      <div class="item ${item.checked ? 'checked' : ''}" data-id="${item.id}">

        <button class="check-btn" onclick="toggleCheck(${item.id})">${item.checked ? '✓' : ''}</button>

        <span class="item-name">${escHtml(item.name)}</span>

        <!-- Static price label (hidden while editing) -->
        <span class="item-price">${item.price > 0 ? '$' + item.price.toFixed(2) : '—'}</span>

        <!-- Inline price editor (shown while editing) -->
        <div class="price-edit-wrap">
          <span class="currency">$</span>
          <input
            class="price-edit-input"
            type="number"
            min="0"
            step="0.01"
            placeholder="0.00"
            onkeydown="
              if (event.key === 'Enter')  confirmEdit(${item.id});
              if (event.key === 'Escape') cancelEdit(${item.id});
            "
          />
          <button class="save-edit-btn" onclick="confirmEdit(${item.id})" title="Save price">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </button>
        </div>

        <!-- Edit button -->
        <button class="edit-btn" onclick="startEdit(${item.id})" title="Edit price">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </button>

        <!-- Delete button -->
        <button class="delete-btn" onclick="deleteItem(${item.id})" title="Remove item">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
          </svg>
        </button>

      </div>
    `).join('');

    empty.classList.toggle('show', items.length === 0);

    const n = items.length;
    badge.textContent = n === 1 ? '1 item' : `${n} items`;

    const sum = items.reduce((acc, i) => acc + (i.price || 0), 0);
    totalEl.textContent = '$' + sum.toFixed(2);
    totalEl.classList.remove('bump');
    void totalEl.offsetWidth;
    totalEl.classList.add('bump');

    const checked = items.filter(i => i.checked).length;
    sub.textContent = checked > 0
      ? `${checked} of ${n} item${n !== 1 ? 's' : ''} checked off`
      : `${n} item${n !== 1 ? 's' : ''} in your list`;
  }

  function escHtml(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(str));
    return d.innerHTML;
  }

  // ── Init ─────────────────────────────────────────────────────

  render();
</script>
</body>
</html>
